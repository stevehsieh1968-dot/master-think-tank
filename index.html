<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大師智囊團</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a serious council chamber; calm, decisive, two traditions facing each other
   IDEA: a round council table, East seated on the left, West on the right, your question in the middle
   PICTURE: the live round table; seats light up with each master's stance
   COLOUR and TYPE: paper white + ink; vermilion seal for East, cobalt for West; Noto Serif TC 900 titles, Noto Sans TC body
   LAYOUT: ask + table first screen; two facing columns of verdicts; synthesis band at the end */
:root{color-scheme:light dark;
--bg:light-dark(#fbfaf7,#121214);--panel:light-dark(#ffffff,#1b1b1f);--ink:light-dark(#18181b,#ecebe7);--mute:light-dark(#62605b,#a3a19b);
--line:light-dark(#e3e0d8,#2e2e33);--east:light-dark(#b8232f,#ef5a5f);--eastbg:light-dark(#fbeceb,#2a1718);
--west:light-dark(#1f4fa8,#6f9cf0);--westbg:light-dark(#e9eff9,#141d2c);--table:light-dark(#f1ede4,#202024)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:"Noto Serif TC",serif;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,4.6vw,50px);font-weight:900}
h2{font-size:clamp(24px,3vw,32px);font-weight:900}
.sub{color:var(--mute);margin:.5em 0 0;max-width:60ch}
.banner{background:#0b0f1e;padding:0}
.banner img{display:block;width:100%;max-width:1240px;height:auto;margin:0 auto;aspect-ratio:1672/941;object-fit:cover}
@media(min-width:1240px){.banner{padding:24px 0 0;background:linear-gradient(#0b0f1e 70%,var(--bg))}.banner img{border-radius:16px;box-shadow:0 18px 48px rgba(0,0,0,.35)}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(20px,4vw,48px);align-items:center}
form{display:grid;gap:12px;margin-top:22px}
label{font-weight:700;font-size:15px}
textarea{width:100%;font:16px/1.6 inherit;font-family:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;resize:vertical}
textarea:focus,button:focus-visible,.seatbtn:focus-visible{outline:3px solid var(--west);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:10px;padding:0 18px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700;padding:0 24px}
.go[disabled]{opacity:.55;cursor:wait}
.chip{min-height:36px;font-size:14px;padding:0 12px;border-radius:99px}
.hint{font-size:13px;color:var(--mute)}
.fig{position:relative;min-height:500px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-family:"Noto Serif TC",serif;font-weight:600;font-size:clamp(13px,1.5vw,16px);line-height:1.45;pointer-events:none;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.center small{display:block;font-family:"Noto Sans TC";font-weight:500;color:var(--mute);font-size:13px;margin-bottom:4px}
.status{min-height:24px;font-size:14px;color:var(--mute)}
.gal{padding-top:0}
.grow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 14px}
.gp{all:unset;cursor:pointer;display:grid;align-content:start;justify-items:center;text-align:center;gap:6px;padding:6px 2px;border-radius:12px}
.gp:hover{background:var(--table)}.gp:focus-visible{outline:3px solid var(--west)}
.gp .ring{width:100%;max-width:150px;aspect-ratio:1;border-radius:50%;border:3px solid var(--east);overflow:hidden;transition:transform .25s}
.gp.w .ring{border-color:var(--west)}.gp:hover .ring{transform:translateY(-4px)}
.gp .ring svg{display:block;width:100%;height:100%}.gp b{font-size:17px;font-family:'Noto Serif TC',serif}.gp small{font-size:13px;color:var(--mute);line-height:1.35}
.gp.off{opacity:.4}
@media(max-width:520px){.grow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.gp .ring{transition:none}}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,3vw,36px)}
.sidehead{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:3px solid currentColor;margin-bottom:16px}
.east .sidehead{color:var(--east)}.west .sidehead{color:var(--west)}
.sidehead span{color:var(--mute);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;scroll-margin-top:20px}
.card.off{opacity:.45}
.ch{display:flex;gap:12px;align-items:center}
.por{flex:none;width:68px;height:68px;border-radius:50%;border:3px solid;overflow:hidden}.por svg{display:block;width:100%;height:100%}
.east .por{border-color:var(--east)}.west .por{border-color:var(--west)}
.ch h3{font-size:19px}.ch p{margin:0;font-size:13px;color:var(--mute)}
.tag{margin-left:auto;flex:none;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1.5px solid currentColor}
.t-支持{color:var(--ink);background:var(--table)}.t-有條件支持{color:var(--west)}.t-先別急{color:#b4690e}.t-反對{color:var(--east)}
.headline{font:900 18px/1.4 "Noto Serif TC",serif;margin:14px 0 6px}
.view{margin:0 0 12px}
dl{margin:0;display:grid;gap:8px;font-size:15px}
dt{font-weight:700;font-size:13px;color:var(--mute)}dd{margin:0}
.east dd.act{border-left:3px solid var(--east);padding-left:10px}.west dd.act{border-left:3px solid var(--west);padding-left:10px}
.skel{height:12px;border-radius:6px;background:var(--line);margin:10px 0;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.4}}
.synth{background:var(--ink);color:var(--bg)}
.synth .wrap>p.lead{font:900 clamp(22px,2.8vw,30px)/1.4 "Noto Serif TC",serif;margin:12px 0 26px;max-width:36ch}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,32px)}
.synth h3{font-size:18px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--bg) 30%,transparent)}
.synth ul,.synth ol{margin:0;padding-left:1.2em}.synth li{margin-bottom:8px}
.bars{display:grid;gap:8px;font-size:14px}
.bar{display:grid;grid-template-columns:6em minmax(0,1fr) 2em;gap:8px;align-items:center}
.track{height:12px;background:color-mix(in srgb,var(--bg) 18%,transparent);border-radius:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%}.track .e{background:var(--east)}.track .w{background:var(--west)}
.legend{font-size:13px;opacity:.8;margin-top:6px}
.copy{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent);margin-top:22px}
.note{font-size:13px;color:var(--mute);margin-top:18px}
@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.sgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.sides{grid-template-columns:minmax(0,1fr)}.fig{min-height:390px}.center{font-size:12px;-webkit-line-clamp:5}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>

const EXAMPLE={q:'在科技公司做了 8 年產品經理，想辭職全職做 AI 教育新創。存款可撐 18 個月，已有 3 位老師願意試用 MVP。該現在辭職，還是先兼職做到有營收？',ctx:'',
views:{
sunzi:{stance:'有條件支持',headline:'先勝而後求戰',view:'勝兵先勝而後求戰。你問「要不要辭職」，是先開戰再求勝。三位老師是「願意試用」，不是「願意付費」——這是虛，不是實。若你在職時能把虛變實、摸清大平台與補教業者最弱之處，糧草（18 個月）不動，再出兵；若資訊仍不足，出兵便是賭。',keyQuestion:'對手最不想做、卻是老師最痛的那一塊是什麼？',action:'在職 3 個月內取得 10 筆付費訂單，作為出兵前的「廟算」。'},
wym:{stance:'支持',headline:'知而不行，只是未知',view:'你說想創業想了很久，又說再等等——知而不行，只是未知。夜深人靜時，你良知所指是哪裡？若真是此事，兼職的猶豫多半是私欲遮蔽：怕失面子、怕失安穩。創業本身就是事上磨練的道場，只是須以誠意行之，不為證明給誰看。',keyQuestion:'若沒有任何人知道你辭職與否，你還會這樣選嗎？',action:'寫下想做這件事的理由，刪去所有「為了證明」的部分，剩下的才是良知。'},
zgf:{stance:'有條件支持',headline:'結硬寨，打呆仗',view:'我一生不信奇計，只信笨功夫。辭不辭職不是關鍵，關鍵是有沒有營寨。18 個月糧草要打七折看——產品延期、收款慢都是常事。每天定日課：拜訪幾位老師、改幾處產品、記幾筆帳。紮穩一寨，再進一步；不求速勝，只求不敗。',keyQuestion:'你每天固定做哪三件「笨事」，能讓這事一年後必然變好？',action:'把 18 個月拆成 6 個季度營寨，每寨設一個不可退讓的指標。'},
ggz:{stance:'有條件支持',headline:'先揣其情，再定捭闔',view:'你只看了自己的情，未揣他人之情。三位老師說願意試用，是真開還是虛應？提出收費，觀其反應——欲聞其聲，反默。現職老闆也是一方：談得好，或能轉兼職、顧問，甚至讓公司成為第一個客戶。辭職要留餘地，門不可關死。',keyQuestion:'老師們真正怕失去的是什麼？你的產品能否直擊它？',action:'對三位老師提出明確報價，記錄每人的第一反應與推託理由。'},
zgl:{stance:'有條件支持',headline:'上中下三策',view:'亮為你謀三策。上策：在職驗證，取得付費客戶與月營收後離職，進可攻退可守。中策：與公司談留職停薪或轉兼職，保留退路。下策：立即辭職，以 18 個月孤注一擲。料敵從寬、用兵從嚴，宜擇上策，並訂下明確出兵時點，以免當斷不斷。',keyQuestion:'哪一個具體數字出現，就是你辭職的那一天？',action:'訂下辭職觸發條件：例如月營收達現薪 30%，或簽下 3 所付費學校。'},
hushi:{stance:'有條件支持',headline:'大膽假設，小心求證',view:'創業本是一個大膽的假設：「老師需要並願意為這個工具付錢」。假設很好，但尚未求證。我主張不必一次賭上全部，而是一點一滴地實驗，拿真實數據說話。有幾分證據，說幾分話；有幾分把握，下幾分注。',keyQuestion:'什麼證據出現，會讓你承認這個假設錯了？',action:'列出三個關鍵假設與各自的驗證實驗，八週內逐一驗完。'},
einstein:{stance:'支持',headline:'做個思維實驗',view:'想像你是 80 歲的自己回頭看：一個參考系裡，你試了、失敗了、回去當 PM；另一個參考系裡，你從沒試。哪個比較難以接受？再換到老師的參考系：他們要的是 AI，還是每週少花兩小時備課？問題簡化之後，答案往往顯而易見。',keyQuestion:'去掉「AI」這個詞，你的產品還解決什麼問題？',action:'用一句不含技術詞的話寫出產品價值，給 5 位老師看是否秒懂。'},
drucker:{stance:'有條件支持',headline:'先界定邊界條件',view:'這不是勇氣問題，是有效決策問題。先界定邊界條件：什麼結果算成功？再做回饋分析：過去 8 年你的長處在哪？若長處是產品而非銷售，初期最大缺口就在銷售，該先補人而非先辭職。企業的目的是創造顧客，不是做出產品。',keyQuestion:'誰是你的顧客——付錢的是學校、老師還是家長？',action:'回顧過去 3 個重大決策的預期與實際結果，找出真正的長處。'},
munger:{stance:'先別急',headline:'反過來想',view:'反過來想：怎樣保證這次創業失敗？辭職後才發現老師不付錢、學校採購週期一年、大廠下個月推免費版。把失敗清單列出來逐條避開。也留意激勵：免費試用誰不願意？還有你自己——想逃離現職的情緒，可能正在扭曲判斷。教育銷售在你的能力圈內嗎？',keyQuestion:'教育市場的採購決策者是誰？他們的激勵是什麼？',action:'列出「保證失敗的 10 種方式」，針對前三項設計防範。'},
jobs:{stance:'支持',headline:'人生太短，別做平庸的東西',view:'我每天早上問鏡子裡的自己：如果今天是最後一天，我還想做今天要做的事嗎？太多天答案是否，就該改變。但聽好——別做什麼「AI 教育平台」，那是平庸的說法。做一件事，做到老師愛不釋手。兼職做不出偉大的產品。',keyQuestion:'老師第一次用它，會發出「哇」的是哪一個瞬間？',action:'把功能砍到只剩一個，讓那一個好到令人驚嘆。'},
buffett:{stance:'先別急',headline:'第一條規則：不要虧掉本金',view:'規則一：不要虧錢；規則二：別忘了規則一。18 個月存款是安全邊際，別全押上——至少留 6 個月生活費不碰。護城河在哪？AI 功能大廠一週就能抄，真正的護城河可能是你和老師的關係與內容資料。先用小錢試，看清楚再下重注。',keyQuestion:'五年後，什麼東西讓有錢的競爭者也抄不走你？',action:'把存款分成「創業可用」與「絕不動用」兩個帳戶。'},
musk:{stance:'支持',headline:'迭代速度就是一切',view:'拆到最小單位：你要驗證的是老師會不會每週用、會不會付錢。這兩件事在職也能測，但速度慢三倍。給自己一個極端期限——6 週做出能收錢的版本。做不到，問題不在辭不辭職；做得到，就全力衝，兼職只會稀釋迭代速度。',keyQuestion:'從零到第一筆收入，理論最短時間是多少？為什麼你需要更久？',action:'設 6 週硬期限做出可收費版本，用結果決定是否全職。'}},
summary:{verdict:'先別辭職——用 90 天在職驗證付費意願，觸發條件一到就全職投入。',
consensus:['「願意試用」不是證據，「付費」才是（孫子、鬼谷子、芒格、胡適）','18 個月存款要打折看，並保留不可動用的安全邊際（曾國藩、巴菲特、諸葛亮）','比起辭不辭職，先定義成功標準與驗證指標更關鍵（德魯克、諸葛亮、胡適）'],
divergence:['速度派（賈伯斯、馬斯克、王陽明）認為兼職會稀釋專注，猶豫本身就是成本','穩健派（巴菲特、芒格、曾國藩）認為保住本金與退路優先，錯誤的速度比慢更致命'],
eastWest:'中國大師多從「勢」與「心」出發：先布局、留退路、看清自己的動機；外國大師更重「數」與「物」：拆成本、算安全邊際、追求極致產品與迭代速度。兩邊在「先驗證、再重押」上意外一致。',
recommendation:'採諸葛亮的上策，搭配馬斯克的硬期限：以付費數字而非熱情，作為辭職的依據。',
steps:['第 1–2 週：向 3 位老師提出明確報價；寫出一句不含技術詞的產品價值','第 3–8 週：做出只有一個核心功能、可收費的版本，目標 10 位付費使用者','第 9–12 週：檢查觸發條件（付費 ≥10 人、月留存 ≥60%），達標即辭職或談留職停薪','全程：存款分兩戶，6 個月生活費不動用；每週做一次日課覆盤'],
risks:['學校採購週期長、個人老師付費意願低——儘早確認誰是付錢的人','大廠推出免費同類功能——護城河要放在內容與使用者關係','把想逃離現職的情緒，誤當成創業的初心']}};

function cardHTML(m){

  const head=`<div class="ch"><div class="por">${avatar(m.id,'',true)}</div><div><h3>${m.name}</h3><p>${m.era}</p></div>${v&&on?`<span class="tag t-${esc(v.stance)}">${esc(v.stance)}</span>`:''}</div>`;
  if(!on)return`<article class="card off" id="c-${m.id}">${head}<p class="hint" style="margin:12px 0 0">此次未入席。點圓桌上的座位可請回。</p></article>`;
  if(!v)return`<article class="card" id="c-${m.id}">${head}<div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:85%"></div></article>`;
  return`<article class="card" id="c-${m.id}">${head}<p class="headline">${esc(v.headline)}</p><p class="view">${esc(v.view)}</p><dl><dt>他會反問你</dt><dd>${esc(v.keyQuestion)}</dd><dt>建議的下一步</dt><dd class="act">${esc(v.action)}</dd></dl></article>`;
}

function renderSummary(){
  const s=state.summary,box=$('#synth');
  if(!s){box.style.display=busy?'':'none';$('#verdict').textContent=busy?'等待各方發言後合議…':'';['#consensus','#divergence','#steps','#risks','#bars'].forEach(k=>$(k).innerHTML='');$('#rec').textContent='';$('#eastWest').textContent='';return}
  box.style.display='';
  $('#verdict').textContent=s.verdict;
  const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  $('#consensus').innerHTML=li(s.consensus);$('#divergence').innerHTML=li(s.divergence);$('#steps').innerHTML=li(s.steps);$('#risks').innerHTML=li(s.risks);
  $('#rec').textContent=s.recommendation||'';$('#eastWest').textContent=s.eastWest||'';
  const act=M.filter(m=>state.active.includes(m.id)&&state.views[m.id]),n=act.length||1;
  $('#bars').innerHTML=STANCES.map(st=>{const e=act.filter(m=>m.side==='east'&&state.views[m.id].stance===st).length,w=act.filter(m=>m.side==='west'&&state.views[m.id].stance===st).length;
    return`<div class="bar"><span>${st}</span><div class="track"><i class="e" style="width:${e/n*100}%"></i><i class="w" style="width:${w/n*100}%"></i></div><b style="text-align:right">${e+w}</b></div>`}).join('');
}
const svg=$('#table');
function drawTable(){
  const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;
  const cx=W/2,cy=H/2,R=Math.min(W*.30,H*.37),rt=R*.62,sr=Math.max(20,Math.min(34,R*.18)),fs=W<480?11:13;
  let o=`<ellipse cx="${cx}" cy="${cy+6}" rx="${rt}" ry="${rt}" fill="#000" opacity=".06"/><circle cx="${cx}" cy="${cy}" r="${rt}" fill="var(--table)" stroke="var(--line)" stroke-width="2"/>`;
  o+=`<line x1="${cx}" y1="${cy-rt}" x2="${cx}" y2="${cy+rt}" stroke="var(--line)" stroke-dasharray="4 6"/>`;
  M.forEach(m=>{
    const grp=M.filter(x=>x.side===m.side),i=grp.indexOf(m);
    const deg=m.side==='east'?105+i*30:75-i*30,a=deg*Math.PI/180;
    const x=cx+R*Math.cos(a),y=cy-R*Math.sin(a);
    const on=state.active.includes(m.id),v=state.views?.[m.id],col=m.side==='east'?'var(--east)':'var(--west)';
    const filled=on&&v&&(v.stance==='支持'||v.stance==='有條件支持');
    const c=Math.cos(a),sn=Math.sin(a),side=Math.abs(c)>.4;
    const anc=side?(c<0?'end':'start'):'middle';
    const lx=side?x+(sr+7)*Math.sign(c):x;
    const ly=side?y-2:(sn>0?y-sr-fs-12:y+sr+fs+6);
    o+=`<g class="seatbtn" data-id="${m.id}" tabindex="0" role="button" aria-label="${m.name}${on?'（入席）':'（離席）'}" style="cursor:pointer;opacity:${on?1:.35}">
      <circle cx="${x}" cy="${y}" r="${sr+6}" fill="transparent"/>
      <circle cx="${x}" cy="${y}" r="${sr+3}" fill="var(--panel)" stroke="${col}" stroke-width="${filled?4:2.5}" ${on&&v&&v.stance==='先別急'?'stroke-dasharray="5 4"':''}/>
      ${avatar(m.id,`x="${x-sr}" y="${y-sr}" width="${2*sr}" height="${2*sr}"`,true)}
      <text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="${fs}" font-weight="700" fill="var(--ink)">${m.name}</text>
      ${on&&v?`<text x="${lx}" y="${ly+fs+3}" text-anchor="${anc}" font-size="${fs-1}" fill="var(--mute)">${esc(v.stance)}</text>`:''}</g>`;
  });
  svg.innerHTML=o;
  const ce=$('#center');ce.style.width=Math.round(rt*1.45)+'px';ce.innerHTML=`<small>${state.example?'範例議題':'本次議題'}</small>${esc(state.q)}`;
}
const tableRO=new ResizeObserver(drawTable);tableRO.observe(svg);
function toggle(id){if(busy)return;const a=state.active;if(a.includes(id)){if(a.length>2)state.active=a.filter(x=>x!==id)}else state.active=[...a,id];render();}
svg.addEventListener('click',e=>{const g=e.target.closest('.seatbtn');if(g)toggle(g.dataset.id)});
svg.addEventListener('keydown',e=>{const g=e.target.closest('.seatbtn');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggle(g.dataset.id)}});
function renderGallery(){
  $('#gallery').innerHTML=M.map(m=>`<button type="button" class="gp ${m.side==='west'?'w':''} ${state.active.includes(m.id)?'':'off'}" data-id="${m.id}"><span class="ring">${avatar(m.id)}</span><b>${m.name}</b><small>${m.tool}</small></button>`).join('');
}
$('#gallery').addEventListener('click',e=>{const b=e.target.closest('.gp');if(b)document.getElementById('c-'+b.dataset.id)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});
function render(){drawTable();renderGallery();renderCards();renderSummary()}
function save(){try{localStorage.setItem('council-v1',JSON.stringify(state))}catch(e){}}

function parseJSON(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('格式錯誤');return JSON.parse(t.slice(a,b+1))}
function sidePrompt(list,q,ctx){
  return`你是「大師智囊團」的書記。請分別以下列每位大師的思維框架與說話風格，針對使用者的問題給出看法。每位大師都要用自己的核心方法分析，觀點要具體、針對這個問題，不可空泛，彼此要有差異，可以互相不同意。
全部使用繁體中文（台灣用語），大師以第一人稱發言。

大師名單：
${list.map(m=>`- id=${m.id}｜${m.name}（${m.era}）：${m.lens}`).join('\n')}

使用者的問題：${q}
${ctx?`背景與限制：${ctx}`:''}

只輸出 JSON，不要任何其他文字，格式：
{"views":{"<id>":{"stance":"支持|有條件支持|先別急|反對 擇一","headline":"不超過14字的核心主張","view":"110到160字的看法，帶出該大師的招牌方法","keyQuestion":"他會反問使用者的一個關鍵問題","action":"一個具體可執行的下一步"}}}`;
}
function sumPrompt(q,ctx,views){
  const lines=M.filter(m=>views[m.id]).map(m=>`${m.name}（${m.side==='east'?'中國':'外國'}）【${views[m.id].stance}】${views[m.id].headline}：${views[m.id].view} 下一步：${views[m.id].action}`).join('\n');
  return`你是智囊團主持人。以下是中外大師對同一問題的發言，請合議出一份客觀、可執行的總結建議。繁體中文（台灣用語）。共識與分歧要點名是哪些大師。
問題：${q}
${ctx?`背景：${ctx}`:''}
發言：
${lines}

只輸出 JSON：{"verdict":"一句話結論，不超過40字","consensus":["2到4點"],"divergence":["2到3點"],"eastWest":"中國與外國大師視角差異，60到100字","recommendation":"綜合建議，40到70字","steps":["3到5個有時間順序的行動步驟"],"risks":["2到3個風險"]}`;
}

let sample=null;
try{window.claude?.use?.('sample')?.then(s=>{sample=s}).catch(()=>{})}catch(e){}
async function callApi(body){
  const r=await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||('HTTP '+r.status));if(r.status===429)e.code='rate_limited';throw e}
  return j.data;
}
const askSide=(g,q,ctx)=>sample?ask(sidePrompt(g,q,ctx)):callApi({kind:'side',ids:g.map(m=>m.id),q,ctx});
const askSum=(q,ctx,views)=>sample?ask(sumPrompt(q,ctx,views)):callApi({kind:'summary',q,ctx,views});
async function ask(prompt){
  const r=await sample(prompt,{modelTier:'default',cache:false});return parseJSON(r.text);
}
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;
  const q=$('#q').value.trim(),ctx=$('#ctx').value.trim();
  if(!q){$('#status').textContent='請先寫下你的問題。';$('#q').focus();return}
  busy=true;$('#go').disabled=true;$('#go').textContent='議事中…';
  state={q,ctx,views:{},summary:null,active:state.active,example:false};render();
  $('#status').textContent='中外兩方大師同時發言中…';
  try{
    const act=M.filter(m=>state.active.includes(m.id));
    const groups=[act.filter(m=>m.side==='east'),act.filter(m=>m.side==='west')].filter(g=>g.length);
    const settled=await Promise.allSettled(groups.map(g=>askSide(g,q,ctx).then(r=>{
      for(const m of g){const v=r.views?.[m.id];if(v){if(!STANCES.includes(v.stance))v.stance='有條件支持';state.views[m.id]=v}}
      render();
    })));
    const failed=settled.filter(x=>x.status==='rejected');
    if(!Object.keys(state.views).length)throw failed[0]?.reason||new Error('沒有收到大師的發言');
    if(failed.length)state.active=state.active.filter(id=>state.views[id]);
    $('#status').textContent='主持人整理合議中…';
    state.summary=await askSum(q,ctx,state.views);
    $('#status').textContent=failed.length?'議事完成（有一組大師這次沒有回應，可以再按一次補上）。':'議事完成。';save();
  }catch(err){
    const c=err&&err.code;
    $('#status').textContent=c==='not_granted'?'需要允許此頁使用 Claude 才能召集智囊團。':c==='rate_limited'?'請求太頻繁，請稍候一分鐘再試。':'這次議事沒有完成（'+(err.message||'未知錯誤')+'），可以再按一次。';
  }finally{busy=false;$('#go').disabled=false;$('#go').textContent='召集智囊團';render();}
});
$('#copy').addEventListener('click',async()=>{
  const s=state.summary;if(!s)return;
  const t=`【議題】${state.q}\n【結論】${s.verdict}\n\n共識：\n${s.consensus.map(x=>'・'+x).join('\n')}\n\n分歧：\n${s.divergence.map(x=>'・'+x).join('\n')}\n\n中西差異：${s.eastWest}\n\n建議：${s.recommendation}\n${s.steps.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\n風險：\n${s.risks.map(x=>'・'+x).join('\n')}`;
  try{await navigator.clipboard.writeText(t);$('#copy').textContent='已複製'}catch(e){$('#copy').textContent='無法複製，請手動選取'}
  setTimeout(()=>$('#copy').textContent='複製總結',1800);
});
if(!state.example){$('#q').value=state.q;$('#ctx').value=state.ctx||''}
render();
}
</script>
